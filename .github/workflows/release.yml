name: Release (Windows)

on:
  pull_request:
    branches: [main]
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci
      - name: Check release versions and tag
        run: npm run check:release
      - name: Frontend tests
        run: npm test
      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --locked
      - name: Build Windows installer and executable
        run: npx tauri build

      - name: Prepare release assets
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          New-Item -ItemType Directory -Path release -Force | Out-Null
          Copy-Item -LiteralPath "src-tauri/target/release/bundle/nsis/MDPad_${version}_x64-setup.exe" -Destination "release/MDPad_${version}_x64-setup.exe" -ErrorAction Stop
          Copy-Item -LiteralPath 'src-tauri/target/release/mdpad.exe' -Destination "release/MDPad_${version}_x64-portable.exe" -ErrorAction Stop
          $hashes = Get-ChildItem release/*.exe | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          }
          [System.IO.File]::WriteAllText((Join-Path $PWD 'release/SHA256SUMS.txt'), ($hashes -join "`n") + "`n", [System.Text.Encoding]::ASCII)

      - uses: actions/upload-artifact@v4
        with:
          name: mdpad-windows
          path: release/
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: mdpad-windows
          path: release

      - name: Verify release assets
        working-directory: release
        run: sha256sum -c SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          assets=("release/MDPad_${version}_x64-setup.exe" "release/MDPad_${version}_x64-portable.exe" "release/SHA256SUMS.txt")
          if gh release view "$GITHUB_REF_NAME" --json tagName >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" --title "MDPad v${version}" --notes-file RELEASE_NOTES.md --verify-tag
          fi
